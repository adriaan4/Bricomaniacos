<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Acceso privado · Bricomaniacos FC</title>
<link rel="stylesheet" href="/style.css"></head>
<body><main class="box"><img src="/escudo.png" alt="Escudo Bricomaniacos FC" style="width:110px">
<h1>Acceso privado</h1><p>Panel de administración</p>
<input id="pw" type="password" placeholder="Contraseña de administrador" autocomplete="current-password" autofocus>
<button id="go">Entrar</button><p class="msg" id="msg" role="status"></p>
</main><script>
const go=async()=>{
 const pw=document.getElementById('pw').value;
 const msg=document.getElementById('msg');
 try{
  const r=await fetch('/api/admin/check',{headers:{'x-admin':pw}});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Acceso denegado');
  sessionStorage.setItem('pw',pw);
  location.href='/#admin';
 }catch(e){msg.textContent=e.message;}
};
document.getElementById('go').onclick=go;
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()};
</script></body></html>
